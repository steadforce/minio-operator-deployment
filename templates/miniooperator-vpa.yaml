{{- if .Capabilities.APIVersions.Has "autoscaling.k8s.io/v1" }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: &deploymentName minio-operator
  annotations: 
    argocd.argoproj.io/sync-wave: "100"
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: *deploymentName
  updatePolicy:
    updateMode: "Off"
{{ end }}
