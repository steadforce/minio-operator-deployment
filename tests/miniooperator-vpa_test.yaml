suite: Minio Operator Self-VPA Tests
templates:
  - templates/miniooperator-vpa.yaml

tests:
  - it: should render VPA with correct config when API is available
    capabilities:
      apiVersions:
        - autoscaling.k8s.io/v1
    release:
      name: my-test-release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VerticalPodAutoscaler
      - equal:
          path: apiVersion
          value: autoscaling.k8s.io/v1

      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "100"

      - equal:
          path: spec.updatePolicy.updateMode
          value: "Off"

      - equal:
          path: spec.targetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.targetRef.kind
          value: Deployment

      - equal:
          path: metadata.name
          value: minio-operator
      - equal:
          path: spec.targetRef.name
          value: minio-operator

  - it: should NOT render VPA when autoscaling API is missing
    asserts:
      - hasDocuments:
          count: 0

  - it: should match snapshot
    capabilities:
      apiVersions:
        - autoscaling.k8s.io/v1
    release:
      name: my-release
    asserts:
      - matchSnapshot: {}